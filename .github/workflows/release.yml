# On a v<version> tag push: test, upload to CurseForge, and publish a GitHub
# release with the same zip. The tag must match ## Version in the TOC, and
# CHANGELOG.md needs a "## <version>" section (tools/release.sh checks both).
# Release type from the version: 1.2.3-alpha1 alpha, 1.2.3-beta1 beta, 1.2.3 release.
# A tag message containing [no-curseforge] makes a GitHub release only.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Upload to CurseForge
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
        run: tools/release.sh --ci
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.cf.outputs.version }}
          TYPE: ${{ steps.cf.outputs.type }}
          ZIP: ${{ steps.cf.outputs.zip }}
        run: |
          pre=(); [[ "$TYPE" != release ]] && pre=(--prerelease)
          gh release create "$TAG" "$ZIP" --verify-tag "${pre[@]}" \
            --title "Bloody Screen Forever $VERSION" --notes-file dist/RELEASE_NOTES.md
